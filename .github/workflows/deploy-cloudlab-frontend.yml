name: CloudLab - Desplegar Frontend

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "¿Autorizar despliegue del frontend CloudLab?"
        required: true
        default: "sí"
        type: choice
        options:
          - "sí"
          - "no"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm_deploy == 'sí' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

      - name: Build CloudLab Frontend
        run: |
          docker build \
            -t ghcr.io/academia-universidad/cloudlab-frontend:latest \
            -f frontend/cloudlab-web/Dockerfile \
            frontend/cloudlab-web

      - name: Push CloudLab Frontend
        run: |
          docker push ghcr.io/academia-universidad/cloudlab-frontend:latest

      - name: Desplegar SOLO CloudLab Frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            IMAGE="ghcr.io/academia-universidad/cloudlab-frontend:latest"
            NAME="cloudlab-web"
            HOST_PORT="6081"
            CONTAINER_PORT="80"

            echo "Desplegando exclusivamente $NAME"

            # Seguridad: no se usa docker compose down ni --remove-orphans.
            # Tampoco se eliminan contenedores por filtros parciales de nombre.

            # Si ya existe cloudlab-web, conservar su red Docker actual.
            NETWORK=$(docker inspect "$NAME" \
              --format '{{range $n,$v := .NetworkSettings.Networks}}{{$n}}{{"\n"}}{{end}}' \
              2>/dev/null | head -n 1 || true)

            # Primera instalación:
            # usar la misma red actual de cloudlab-api para que el frontend
            # pueda convivir con la infraestructura CloudLab existente.
            if [ -z "$NETWORK" ]; then
              NETWORK=$(docker inspect cloudlab-api \
                --format '{{range $n,$v := .NetworkSettings.Networks}}{{$n}}{{"\n"}}{{end}}' \
                2>/dev/null | head -n 1 || true)
            fi

            if [ -z "$NETWORK" ]; then
              echo "ERROR: No se pudo determinar una red Docker segura."
              echo "No se modifica ningún contenedor."
              exit 1
            fi

            if ! docker network inspect "$NETWORK" >/dev/null 2>&1; then
              echo "ERROR: La red Docker $NETWORK no existe."
              echo "No se modifica ningún contenedor."
              exit 1
            fi

            echo "Red Docker: $NETWORK"

            # Comprobar que el puerto de prueba no esté ocupado por otro contenedor.
            PORT_OWNER=$(docker ps \
              --format '{{.Names}} {{.Ports}}' \
              | grep -E "(^|[^0-9])${HOST_PORT}->|:${HOST_PORT}->" \
              | awk '{print $1}' \
              | head -n 1 || true)

            if [ -n "$PORT_OWNER" ] && [ "$PORT_OWNER" != "$NAME" ]; then
              echo "ERROR: El puerto $HOST_PORT ya está utilizado por $PORT_OWNER."
              echo "No se modifica ningún contenedor."
              exit 1
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            # Descargar la nueva imagen antes de tocar el frontend existente.
            docker pull "$IMAGE"

            OLD_IMAGE=""
            HAD_OLD_CONTAINER="false"

            if docker inspect "$NAME" >/dev/null 2>&1; then
              HAD_OLD_CONTAINER="true"
              OLD_IMAGE=$(docker inspect "$NAME" --format '{{.Config.Image}}')
              echo "Imagen actual: $OLD_IMAGE"

              # Se toca exclusivamente cloudlab-web.
              docker stop "$NAME"
              docker rm "$NAME"
            fi

            start_frontend () {
              docker run -d \
                --name "$NAME" \
                --restart unless-stopped \
                --network "$NETWORK" \
                -p "${HOST_PORT}:${CONTAINER_PORT}" \
                --log-driver json-file \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                "$1"
            }

            start_frontend "$IMAGE"

            OK=false

            for i in 1 2 3; do
              sleep 5

              STATUS=$(docker inspect "$NAME" \
                --format '{{.State.Status}}' 2>/dev/null || echo not-found)

              echo "Validación $i/3: $STATUS"

              if [ "$STATUS" = "running" ]; then
                # nginx.conf del frontend expone /health.
                if docker exec "$NAME" \
                  wget -q -O - http://127.0.0.1/health >/dev/null 2>&1; then
                  OK=true
                  break
                fi

                echo "El contenedor está running, pero /health todavía no responde."
              fi

              docker logs --tail=50 "$NAME" || true
            done

            if [ "$OK" = "true" ]; then
              echo "CloudLab Frontend desplegado correctamente."
              echo "Puerto de prueba conservado: ${HOST_PORT}:${CONTAINER_PORT}"
              echo "Red: $NETWORK"
              docker logs --tail=30 "$NAME" || true
              exit 0
            fi

            echo "ERROR: La nueva versión del frontend no inició correctamente."
            docker logs "$NAME" || true

            # El rollback también afecta exclusivamente cloudlab-web.
            docker rm -f "$NAME" 2>/dev/null || true

            if [ "$HAD_OLD_CONTAINER" = "true" ] && [ -n "$OLD_IMAGE" ]; then
              echo "Ejecutando rollback del frontend a $OLD_IMAGE"
              start_frontend "$OLD_IMAGE"
              sleep 5

              ROLLBACK_STATUS=$(docker inspect "$NAME" \
                --format '{{.State.Status}}' 2>/dev/null || echo not-found)

              echo "Estado después del rollback: $ROLLBACK_STATUS"
            else
              echo "Era la primera instalación de cloudlab-web; no existe versión anterior para rollback."
            fi

            exit 1

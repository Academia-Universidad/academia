name: Programacion V - Desplegar API

on:
  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # PASO 1
      # Descargar el código del repositorio
      # ==================================================

      - name: Descargar código
        uses: actions/checkout@v4


      # ==================================================
      # PASO 2
      # Autenticarse en GHCR
      # ==================================================

      - name: Login en GHCR
        run: |
          echo "${{ secrets.GHCR_TOKE }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin


      # ==================================================
      # PASO 3
      # Construir imagen Docker
      # ==================================================

      - name: Construir imagen Docker
        run: |
          docker build \
            -t ghcr.io/academia-universidad/programacionv-api:latest \
            .


      # ==================================================
      # PASO 4
      # Publicar la imagen en GHCR
      # ==================================================

      - name: Publicar imagen en GHCR
        run: |
          docker push ghcr.io/academia-universidad/programacionv-api:latest


      # ==================================================
      # PASO 5
      # Conectarse al VPS y desplegar
      # ==================================================

      - name: Desplegar en VPS
        uses: appleboy/ssh-action@v1.2.0

        with:

          host: ${{ secrets.VPS_HOST }}

          username: ${{ secrets.VPS_USERNAME }}

          password: ${{ secrets.VPS_PASSWORD }}

          port: 22

          script: |

            set -e

            IMAGE="ghcr.io/academia-universidad/programacionv-api:latest"

            NAME="programacionv-api"

            DATA_DIR="/opt/programacionv/Data"


            echo "===================================="
            echo "Preparando carpeta de datos"
            echo "===================================="

            mkdir -p "$DATA_DIR"


            echo "===================================="
            echo "Login GHCR desde VPS"
            echo "===================================="

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin


            echo "===================================="
            echo "Descargando imagen"
            echo "===================================="

            docker pull "$IMAGE"


            echo "===================================="
            echo "Deteniendo versión anterior"
            echo "===================================="

            docker stop "$NAME" 2>/dev/null || true

            docker rm "$NAME" 2>/dev/null || true


            echo "===================================="
            echo "Creando nuevo contenedor"
            echo "===================================="

            docker run -d \
              --name "$NAME" \
              --restart unless-stopped \
              -p 6090:8080 \
              -v "$DATA_DIR:/app/Data" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://+:8080 \
              "$IMAGE"


            echo "===================================="
            echo "Verificando contenedor"
            echo "===================================="

            sleep 5

            docker ps --filter "name=$NAME"


            echo "===================================="
            echo "Despliegue terminado"
            echo "===================================="